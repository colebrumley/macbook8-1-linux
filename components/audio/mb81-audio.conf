# macbook8-1-linux audio (MacBook8,1). Keep the codec in D0: a runtime D3 cycle is reported to
# disturb the TDM amp rails, which nothing re-arms. (Tested and rejected: probe_only=2 +
# single_cmd=1 "no reset" attach; it breaks HDMI audio and spams spurious responses.)
options snd-hda-intel power_save=0
