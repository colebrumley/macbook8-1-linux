# macbook8-1-linux: MacBook8,1 internal speakers.
# The speakers are a 4-slot TDM link on hw:PCH,1 (CS4208 converter 0x0a), which the
# patched driver exposes as S16_LE / 4 ch / 44.1 kHz only (48 kHz latches the codec PLL
# fault). ALSA's card profiles see that PCM as 2-ch S/PDIF and can't open it, so define
# the sink explicitly. Stereo clients are up-mixed: FL/FR copied to RL/RR.
# nofail: sessions without access to the card (SSH, no seat ACL) must still start.
context.objects = [
  { factory = adapter
    args = {
      factory.name           = api.alsa.pcm.sink
      node.name              = "macbook_speakers"
      node.description      = "MacBook Speakers"
      media.class            = "Audio/Sink"
      api.alsa.path          = "hw:PCH,1"
      api.alsa.period-size   = 1024
      api.alsa.headroom      = 1024
      audio.format           = "S16LE"
      audio.rate             = 44100
      audio.channels         = 4
      audio.position         = [ FL FR RL RR ]
      channelmix.upmix       = true
      channelmix.upmix-method = simple
      priority.session       = 1500
      priority.driver        = 1500
      node.pause-on-idle     = true
      session.suspend-timeout-seconds = 3
    }
    flags = [ nofail ]
  }
]
